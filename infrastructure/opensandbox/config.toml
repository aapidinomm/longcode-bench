[server]
host = "127.0.0.1"
port = 8080
max_sandbox_timeout_seconds = 7200

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.20"

[storage]
allowed_host_paths = ["/tmp"]
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = ".state/opensandbox.db"

[docker]
network_mode = "bridge"
drop_capabilities = [
    "AUDIT_WRITE",
    "MKNOD",
    "NET_ADMIN",
    "NET_RAW",
    "SYS_ADMIN",
    "SYS_MODULE",
    "SYS_PTRACE",
    "SYS_TIME",
    "SYS_TTY_CONFIG",
]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 4096
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.3"
mode = "dns+nft"

[renew_intent]
enabled = false
min_interval_seconds = 60

